<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todo List{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css"
        rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
  <div class="row">

    <aside class="col-md-3 col-xl-2 py-4">
      <div class="card border-0 shadow-sm sticky-top" style="top: 1.5rem;">
        <div class="card-body text-center pb-2">
          <i class="bi bi-journal-check display-6 text-primary"></i>
          <h5 class="mt-2 mb-0">My Todo</h5>
        </div>
        {% with url_name=request.resolver_match.url_name %}
          <div class="list-group list-group-flush">
            <a href="{% url 'todo:index' %}"
               class="list-group-item list-group-item-action {% if url_name == 'index' %}active{% endif %}">
              <i class="bi bi-list-task me-2"></i>Home
            </a>
            <a href="{% url 'todo:tag-list' %}"
               class="list-group-item list-group-item-action {% if url_name == 'tag-list' %}active{% endif %}">
              <i class="bi bi-bookmark me-2"></i>Tags
            </a>
          </div>
        {% endwith %}
      </div>
    </aside>

    <main class="col-md-9 col-xl-10 py-4 px-md-4">
      {% block content %}{% endblock %}
    </main>

  </div>
</div>
</body>
</html>
