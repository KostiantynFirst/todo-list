{% extends "base.html" %}

{% block content %}
  <div class="card border-0 shadow-sm mx-auto text-center" style="max-width: 520px;">
    <div class="card-body p-4">
      <i class="bi bi-exclamation-triangle display-5 text-danger"></i>
      <h3 class="mt-3">Delete this tag?</h3>
      <p class="fs-5 my-3">#{{ object.name }}</p>
      <p class="small text-muted">Tasks with this tag will stay, only the tag will be removed.</p>
      <form method="post" class="d-flex justify-content-center gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger rounded-pill px-4">Yes, delete</button>
        <a href="{% url 'todo:tag-list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
