{% extends "base.html" %}

{% block content %}
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <h2 class="mb-0">Tags</h2>
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary rounded-pill px-4">
      <i class="bi bi-plus-circle me-1"></i>New tag
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th class="ps-4">Name</th>
          <th class="text-end pe-4">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for tag in tag_list %}
          <tr>
            <td class="ps-4"><span class="badge rounded-pill bg-info fs-6">#{{ tag.name }}</span></td>
            <td class="text-end pe-4">
              <a href="{% url 'todo:tag-update' pk=tag.id %}" class="btn btn-sm btn-link text-decoration-none">
                <i class="bi bi-pencil"></i> Update
              </a>
              <a href="{% url 'todo:tag-delete' pk=tag.id %}" class="btn btn-sm btn-link link-danger text-decoration-none">
                <i class="bi bi-trash"></i> Delete
              </a>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="2" class="text-center text-muted py-4">No tags yet.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
